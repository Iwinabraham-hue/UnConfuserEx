name: Compile UnConfuserEx Online

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Uses the standard modern .NET compilation environment

    - name: Build Solution
      run: dotnet build --configuration Release

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Built-UnConfuserEx
        path: "**/bin/Release/**"
